<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXURY RECYCLE | 全球顶级奢侈品专业回收与鉴定中心</title>
    <style>
        :root {
            --bg-color: #0c0c0c;
            --card-bg: #141414;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa8c2c;
            --text-main: #f5f5f7;
            --text-secondary: #888;
            --border-color: rgba(212, 175, 55, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
        }

        /* 顶部导航与标语 */
        header {
            text-align: center;
            padding: 50px 20px;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(to bottom, #111, #0c0c0c);
        }

        header h1 {
            color: var(--gold);
            font-size: 2.8rem;
            letter-spacing: 3px;
            margin-bottom: 12px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .contact-bar {
            display: inline-block;
            border: 1px solid var(--gold);
            padding: 10px 30px;
            color: var(--gold-light);
            border-radius: 30px;
            font-size: 0.95rem;
            background: rgba(212, 175, 55, 0.05);
            letter-spacing: 1px;
        }

        /* 展柜网格区 */
        .container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            color: var(--gold);
            font-size: 1.5rem;
            margin-bottom: 25px;
            border-left: 4px solid var(--gold);
            padding-left: 12px;
            letter-spacing: 1px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 25px rgba(212, 175, 55, 0.2);
            border-color: var(--gold);
        }

        .product-img-box {
            width: 100%;
            height: 240px;
            background-color: #1a1a1a;
            position: relative;
            overflow: hidden;
        }

        .product-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-img-box img {
            transform: scale(1.05);
        }

        .tag-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.75);
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 4px 10px;
            font-size: 0.75rem;
            border-radius: 4px;
            letter-spacing: 1px;
        }

        .product-info {
            padding: 16px;
        }

        .product-title {
            font-size: 1rem;
            color: var(--text-main);
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .price {
            color: #ff4d4f;
            font-weight: bold;
            font-size: 1rem;
        }

        .action-btn {
            display: block;
            width: 100%;
            text-align: center;
            background: transparent;
            border: 1px solid var(--gold-dark);
            color: var(--gold-light);
            padding: 8px 0;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
        }

        /* 页脚 */
        footer {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            margin-top: 80px;
            background: #080808;
        }
    </style>
</head>
<body>

    <header>
        <h1>LUXURY RECYCLE</h1>
        <p>全球顶级奢侈品专业回收与鉴定中心 · 官方典藏展柜</p>
        <div class="contact-bar">
            📞 24小时专业奢品估价与回收热线 / 鉴定咨询
        </div>
    </header>

    <div class="container">
        <h2 class="section-title">精选二手奢品回收档案 (共 1400 件)</h2>
        
        <!-- 1400 个作品动态网格 -->
        <div class="gallery-grid" id="luxuryGrid">
            <!-- JS 自动生成全部内容 -->
        </div>
    </div>

    <footer>
        &copy; 2026 LUXURY RECYCLE International. All Rights Reserved. 专业正品鉴定，支持当面回收。
    </footer>

    <script>
        // 奢品分类或品名备选库，用于为 1400 件商品自动匹配逼真的大牌名称
        const brands = ["【全新全套】经典款手袋", "【99新】限量版单肩包", "【收藏级】高级定制皮具", "【95新】经典老花系列", "【专柜正品】时尚奢华配饰", "【极品成色】经典商务公文包"];
        
        const totalItems = 1400;
        const grid = document.getElementById('luxuryGrid');
        const fragment = document.createDocumentFragment();

        for (let i = 1; i <= totalItems; i++) {
            const card = document.createElement('div');
            card.className = 'product-card';

            // 随机匹配一个逼真的奢品标题和价格
            const brandTitle = brands[(i - 1) % brands.length];
            const randomPrice = (Math.random() * 3 + 0.5).toFixed(1) + " 万";

            // 对应图片命名：1.png, 2.png ... 1400.png
            card.innerHTML = `
                <div class="product-img-box">
                    <span class="tag-badge">正品鉴定</span>
                    <img src="${i}.png" alt="二手奢品 #${i}" loading="lazy">
                </div>
                <div class="product-info">
                    <div class="product-title">${brandTitle} #${i}</div>
                    <div class="product-details">
                        <span>成色: 99新</span>
                        <span class="price">估价: ${randomPrice}</span>
                    </div>
                    <a href="javascript:alert('正在为您连接鉴定师，编号：#${i}');" class="action-btn">立即询价 / 鉴定</a>
                </div>
            `;

            fragment.appendChild(card);
        }

        grid.appendChild(fragment);
    </script>

</body>
</html>
